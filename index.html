<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kas Kelas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            background: #FFD1D7;
            color: white;
            padding: 25px 20px;
            border-radius: 0 0 20px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin-bottom: 0;
        }

        .content {
            padding: 20px;
        }

        .saldo-box {
            background: #f1f1f1;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .saldo-box p {
            margin: 0 0 8px;
            color: #666666;
        }

        .saldo-box h2 {
            margin: 0;
            font-size: 28px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #FFD1D7;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            opacity: 0.7;
        }

        .hasil {
            margin-top: 25px;
        }

        .hasil h3 {
            margin-bottom: 10px;
        }

        .transaksi {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .transaksi p {
            margin: 6px 0;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>Kas Kelas</h1>
        <p>Catatan keuangan kelas XII.D</p>
    </div>

    <div class="content">

        <div class="saldo-box">
            <p>Saldo Saat Ini</p>
            <h2 id="saldo">Rp 0</h2>
        </div>

        <h3>Tambah Transaksi</h3>

        <label>Uang Masuk</label>
        <input type="number" id="uangMasuk" placeholder="Contoh: 50000">

        <label>Uang Keluar</label>
        <input type="number" id="uangKeluar" placeholder="Contoh: 20000">

        <button onclick="simpanTransaksi()">
            Simpan Transaksi
        </button>

        <div class="hasil">
            <h3>Transaksi Terakhir</h3>

            <div class="transaksi">
                <p>Saldo Awal: <b id="saldoAwal">Rp 0</b></p>
                <p>Uang Masuk: <b id="masuk">Rp 0</b></p>
                <p>Uang Keluar: <b id="keluar">Rp 0</b></p>
                <p>Saldo Akhir: <b id="saldoAkhir">Rp 0</b></p>
            </div>
        </div>

    </div>

</div>

<script>

let saldo = 0;

function formatRupiah(angka) {
    return "Rp " + angka.toLocaleString("id-ID");
}

function simpanTransaksi() {

    let uangMasuk =
        Number(document.getElementById("uangMasuk").value);

    let uangKeluar =
        Number(document.getElementById("uangKeluar").value);

    let saldoAwal = saldo;

    saldo = saldo + uangMasuk - uangKeluar;

    document.getElementById("saldo").innerHTML =
        formatRupiah(saldo);

    document.getElementById("saldoAwal").innerHTML =
        formatRupiah(saldoAwal);

    document.getElementById("masuk").innerHTML =
        formatRupiah(uangMasuk);

    document.getElementById("keluar").innerHTML =
        formatRupiah(uangKeluar);

    document.getElementById("saldoAkhir").innerHTML =
        formatRupiah(saldo);

    document.getElementById("uangMasuk").value = "";
    document.getElementById("uangKeluar").value = "";
}

</script>

</body>
</html>
